<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32" fill="none">
  <title>Funnest</title>
  <!-- Full-bleed version of the mark for avatars (GitHub/npm/Vercel crop to a rounded square or circle). -->
  <defs>
    <linearGradient id="fn-avatar-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#5A3BF0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#fn-avatar-bg)"/>
  <g transform="translate(16 16) scale(0.8) translate(-17.2 -13.4)">
    <path d="M7 13.5C9.5 21.5 17 23.5 23.4 11.2" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="24.6" cy="8.6" r="2.9" fill="#FFD43B"/>
  </g>
</svg>
